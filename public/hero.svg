<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="A task list with ticks, priorities and a progress ring">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff" />
      <stop offset="0.5" stop-color="#f5f3ff" />
      <stop offset="1" stop-color="#fdf2f8" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c1d95" flood-opacity="0.16" />
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="480" height="340" rx="28" fill="url(#skyGrad)" />

  <!-- decorative shapes -->
  <circle cx="52" cy="298" r="66" fill="#ddd6fe" opacity="0.55" />
  <circle cx="434" cy="48" r="44" fill="#fbcfe8" opacity="0.6" />
  <circle cx="252" cy="322" r="10" fill="#a5b4fc" opacity="0.8" />
  <circle cx="452" cy="196" r="7" fill="#5eead4" opacity="0.9" />
  <circle cx="28" cy="66" r="6" fill="#f9a8d4" opacity="0.9" />

  <!-- main task card -->
  <rect x="44" y="40" width="292" height="262" rx="24" fill="#ffffff" filter="url(#softShadow)" />

  <rect x="68" y="64" width="74" height="22" rx="11" fill="#eef2ff" />
  <text x="84" y="79" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="11.5" font-weight="700" fill="#4f46e5" letter-spacing="0.2">Today</text>
  <text x="312" y="79" text-anchor="end"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="11" font-weight="600" fill="#94a3b8">3 of 5 done</text>

  <rect x="68" y="98" width="244" height="8" rx="4" fill="#eef2ff" />
  <rect x="68" y="98" width="152" height="8" rx="4" fill="url(#brandGrad)" />

  <!-- row 1: high priority, not done -->
  <circle cx="82" cy="140" r="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
  <rect x="106" y="130" width="116" height="8" rx="4" fill="#94a3b8" />
  <rect x="106" y="144" width="68" height="6" rx="3" fill="#e2e8f0" />
  <rect x="240" y="128" width="58" height="20" rx="10" fill="#ffe4e6" />
  <text x="269" y="142" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="10" font-weight="700" fill="#e11d48">High</text>

  <!-- row 2: medium, in progress -->
  <circle cx="82" cy="192" r="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" />
  <circle cx="82" cy="192" r="5" fill="url(#amberGrad)" />
  <rect x="106" y="182" width="132" height="8" rx="4" fill="#94a3b8" />
  <rect x="106" y="196" width="86" height="6" rx="3" fill="#e2e8f0" />
  <rect x="240" y="180" width="58" height="20" rx="10" fill="#fef3c7" />
  <text x="269" y="194" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="10" font-weight="700" fill="#b45309">Mid</text>

  <!-- row 3: done -->
  <circle cx="82" cy="244" r="12" fill="url(#tealGrad)" />
  <path d="M76.5 244.5 80.5 248.5 88 240" fill="none" stroke="#ffffff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" />
  <rect x="106" y="240" width="104" height="8" rx="4" fill="#cbd5e1" />
  <rect x="108" y="243.5" width="100" height="1.6" rx="0.8" fill="#94a3b8" />
  <rect x="240" y="234" width="58" height="20" rx="10" fill="#ccfbf1" />
  <text x="269" y="248" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="10" font-weight="700" fill="#0f766e">Done</text>

  <!-- floating progress ring card -->
  <rect x="300" y="52" width="148" height="148" rx="22" fill="#ffffff" filter="url(#smallShadow)" />
  <circle cx="374" cy="126" r="42" fill="none" stroke="#eef2ff" stroke-width="12" />
  <circle cx="374" cy="126" r="42" fill="none" stroke="url(#brandGrad)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="190 264" transform="rotate(-90 374 126)" />
  <text x="374" y="131" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="21" font-weight="800" fill="#4338ca">72%</text>
  <text x="374" y="148" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="9.5" font-weight="600" fill="#94a3b8" letter-spacing="0.6">DONE</text>

  <!-- floating mini chart card -->
  <rect x="318" y="220" width="132" height="82" rx="18" fill="#ffffff" filter="url(#smallShadow)" />
  <rect x="338" y="260" width="12" height="24" rx="6" fill="url(#brandGrad)" />
  <rect x="360" y="248" width="12" height="36" rx="6" fill="url(#pinkGrad)" />
  <rect x="382" y="238" width="12" height="46" rx="6" fill="url(#tealGrad)" />
  <rect x="404" y="254" width="12" height="30" rx="6" fill="url(#amberGrad)" />
  <rect x="338" y="236" width="46" height="6" rx="3" fill="#e2e8f0" />

  <!-- tiny sparkle -->
  <path d="M450 132l3.2 7.2 7.2 3.2-7.2 3.2-3.2 7.2-3.2-7.2-7.2-3.2 7.2-3.2z"
        fill="#fbbf24" opacity="0.9" />
</svg>
